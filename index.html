<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion du Réseau de Transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Gestion du Réseau</h1>
<nav>
<a href="#depots">Dépôts</a>
<a href="#lignes">Lignes</a>
<a href="#materiel">Matériel</a>
</nav>
</header>


<main>


<!-- DEPOTS -->
<section id="depots">
<h2>Création d’un dépôt</h2>
<form id="depotForm">
<input id="depotNom" placeholder="Nom du dépôt" required>
<input id="depotExploitant" placeholder="Exploitant" required>
<button>Créer</button>
</form>


<h3>Vue du matériel par dépôt</h3>
<ul id="depotView"></ul>
</section>


<!-- LIGNES -->
<section id="lignes">
<h2>Création d’une ligne</h2>
<form id="ligneForm">
<input id="ligneNom" maxlength="50" placeholder="Nom de la ligne" required>
<input id="ligneT1" maxlength="100" placeholder="Terminus 1" required>
<input id="ligneT2" maxlength="100" placeholder="Terminus 2" required>


<select id="ligneDepot"></select>
<select id="ligneType">
<option>Bus</option>
<option>Tram-train</option>
<option>Ferry</option>
</select>


<button>Créer</button>
</form>


<ul id="ligneList"></ul>
</section>


<!-- MATERIEL -->
<section id="materiel">
<h2>Création d’un bus</h2>
<form id="busForm">
<input id="busNum" maxlength="4" placeholder="N° de carrosserie" required>


<select id="busConstructeur">
<option>Iveco</option>
<option>Heuliez Bus</option>
<option>HESS</option>
</select>


<input id="busModele" maxlength="100" placeholder="Modèle" required>


<select id="busLigne"></select>
<select id="busDepot"></select>


<button>Créer</button>
</form>


<ul id="busList"></ul>
</section>


</main>


<script src="script.js"></script>
</body>
</html>
