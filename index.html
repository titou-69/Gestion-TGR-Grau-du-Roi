<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion des Transports Urbains</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
<h1>Réseau de Transports Urbains</h1>
<nav>
<a href="#lignes">Lignes</a>
<a href="#materiel">Matériel</a>
<a href="#stats">Statistiques</a>
<a href="#carte">Carte</a>
</nav>
</header>


<main>


<section id="lignes">
<h2>Lignes de bus</h2>
<form id="ligneForm">
<input id="ligneNom" placeholder="Nom de la ligne" required>
<input id="ligneHoraire" placeholder="Horaires" required>
<button>Ajouter</button>
</form>
<ul id="ligneList"></ul>
</section>


<section id="materiel">
<h2>Matériel roulant</h2>
<form id="materielForm">
<input id="matNom" placeholder="Numéro / Série" required>
<input id="matDepot" placeholder="Dépôt" required>


<select id="matLigne">
<option value="">— Ligne —</option>
</select>


<select id="matEtat">
<option>En service</option>
<option>Réserve</option>
<option>Panne</option>
</select>


<button>Ajouter</button>
</form>
<ul id="materielList"></ul>
</section>


<section id="stats">
<h2>Vue par ligne</h2>
<ul id="statsList"></ul>
</section>


<section id="carte">
<h2>Carte du réseau</h2>
<iframe src="https://umap.openstreetmap.fr/fr/map/projets-transports-grau-du-roi_1156972?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true"></iframe>
</section>


</main>


<footer>
© 2026 – Gestion des transports urbains
</footer>


<script src="script.js"></script>
</body>
</html>
